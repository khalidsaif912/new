<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>الشريط الإخباري</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Tajawal, system-ui, sans-serif;
      letter-spacing: 0;
      padding: 24px;
      text-align: center;
    }
    p { margin: 0 0 14px; color: #94a3b8; font-weight: 700; line-height: 1.5; }
    button, a {
      border: 0;
      border-radius: 12px;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #111; }
    a { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; margin-inline-start: 8px; }
  </style>
</head>
<body>
  <div>
    <p id="hint">جاري فتح نافذة الكتابة…</p>
    <button type="button" id="openBtn">اكتب رسالة</button>
    <a id="homeBtn" href="../index.html">رجوع</a>
  </div>
  <script src="../holiday-ticker.js?v=20260814d"></script>
  <script>
  (function () {
    function docsBase() {
      try {
        var m = String(location.pathname || '').match(/^(.*?\/docs\/)/);
        return m ? m[1] : '../';
      } catch (e) {
        return '../';
      }
    }
    document.getElementById('homeBtn').href = docsBase().replace(/\/?$/, '/') + 'index.html';
    function open() {
      if (window.rosterHolidayTicker && window.rosterHolidayTicker.openCompose) {
        window.rosterHolidayTicker.openCompose();
        document.getElementById('hint').textContent = 'اكتب رسالتك في النافذة، أو اضغط الزر مرة أخرى.';
      } else {
        document.getElementById('hint').textContent = 'تعذر فتح النافذة. ارجع للرئيسية واضغط أيقونة الدردشة في الشريط.';
      }
    }
    document.getElementById('openBtn').addEventListener('click', open);
    setTimeout(open, 250);
  })();
  </script>
<script defer src="../site-visits.js?v=20260809a"></script>
</body>
</html>
