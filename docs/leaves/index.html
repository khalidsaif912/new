<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>الإجازات</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('rosterLang') === 'en') {
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('dir', 'ltr');
          document.title = 'Leaves';
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-ar: 'IBM Plex Sans Arabic', Cairo, Tahoma, sans-serif;
      --font-en: 'IBM Plex Sans', Inter, system-ui, -apple-system, sans-serif;
      --brand: #1e40af;
      --brand-2: #1976d2;
      --brand-3: #0ea5e9;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #eef1f7;
      color: var(--text);
      font-family: var(--font-ar);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { font-family: inherit; }
    html[lang="en"] body { font-family: var(--font-en); }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding:
        calc(10px + var(--safe-top))
        14px
        calc(22px + var(--safe-bottom));
    }

    .srOnly {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Header ── */
    .header {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 168px;
      padding: 10px 14px 14px;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 52%, var(--brand-3) 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(30, 64, 175, .16);
    }
    .header::after {
      content: "";
      position: absolute;
      inset-inline-end: -46px;
      bottom: -76px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }
    .headerTop {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .backBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .12);
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .backBtn:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .34);
    }
    .backBtn:active { transform: scale(.97); }
    .backBtn svg { width: 17px; height: 17px; flex-shrink: 0; }
    html[lang="en"] .backBtn svg { transform: scaleX(-1); }
    .pageTitle {
      flex: 1 1 auto;
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      text-shadow: 0 1px 8px rgba(15, 23, 42, .22);
    }
    .headerSpacer {
      flex: 0 0 auto;
      width: 68px;
      height: 1px;
    }

    .headerBody {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: min(4vw, 18px);
      padding-top: 4px;
    }
    .heroNum {
      font-family: var(--font-en);
      font-size: clamp(66px, 24vw, 104px);
      font-weight: 800;
      line-height: .82;
      letter-spacing: -.045em;
      color: rgba(255, 255, 255, .34);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 18px rgba(15, 23, 42, .10);
    }
    .heroSide {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding-inline-start: min(2.5vw, 12px);
      border-inline-start: 1px solid rgba(255, 255, 255, .16);
    }
    .heroLabel {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.4;
      color: rgba(255, 255, 255, .92);
    }
    .heroMonth {
      font-size: clamp(15px, 4.4vw, 19px);
      font-weight: 800;
      line-height: 1.2;
      color: #fff;
      white-space: nowrap;
    }

    /* ── Source tabs: white capsule matching the month chips ── */
    .sourceTabs {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 0 0 10px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .sourceTabs::before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      inset-inline-start: 4px;
      width: calc(50% - 4px);
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      box-shadow: 0 3px 9px -3px rgba(30, 64, 175, .55);
      transition: inset-inline-start .28s cubic-bezier(.22, 1, .36, 1);
      pointer-events: none;
    }
    .sourceTabs[data-active="import"]::before { inset-inline-start: 50%; }
    /* First paint should snap to the URL's source instead of sliding in. */
    .sourceTabs.no-anim::before,
    .sourceTabs.no-anim .sourceTab,
    .sourceTabs.no-anim .sourceTabCount { transition: none; }
    .sourceTab {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sourceTab:hover { color: var(--text); }
    .sourceTab.is-active { color: #fff; }
    .sourceTabCount {
      min-width: 20px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background: #f1f5f9;
      color: var(--text-secondary);
      font-family: var(--font-en);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.7;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: background .2s ease, color .2s ease;
    }
    .sourceTab.is-active .sourceTabCount {
      background: rgba(255, 255, 255, .22);
      color: #fff;
    }

    /* ── Month strip ── */
    .monthStripWrap { margin: 10px 0; }
    .monthStrip {
      display: flex;
      gap: 6px;
      padding: 2px 2px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .monthStrip::-webkit-scrollbar { display: none; }
    .monthChip {
      flex: 0 0 auto;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 64px;
      padding: 7px 10px 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
      transition:
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        transform .15s ease,
        color .2s ease,
        opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .monthChip:active { transform: scale(.97); }
    .chipMonth { font-size: 12px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
    .chipCount {
      font-family: var(--font-en);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .monthChip.is-empty { opacity: .5; }
    .monthChip.is-active {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-color: transparent;
      color: #fff;
      opacity: 1;
      box-shadow: 0 5px 12px -4px rgba(30, 64, 175, .5);
    }
    .monthChip.is-active .chipCount { color: rgba(255, 255, 255, .8); }

    /* ── Leave list: department cards ── */
    .listCard {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .listCard[hidden] { display: none; }
    .deptCard {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .deptCard::before {
      content: "";
      display: block;
      height: 4px;
      background: var(--dept, #64748b);
      background: linear-gradient(to left, var(--dept, #64748b), color-mix(in srgb, var(--dept, #64748b) 35%, #fff));
    }
    html[lang="en"] .deptCard::before {
      background: linear-gradient(to right, var(--dept, #64748b), color-mix(in srgb, var(--dept, #64748b) 35%, #fff));
    }
    .deptHead {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-bottom: 1px solid #f1f5f9;
    }
    .deptIcon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--dept, #64748b);
      color: #fff;
      box-shadow: 0 4px 10px -4px var(--dept, #64748b);
    }
    .deptIcon svg {
      display: block;
      width: 18px;
      height: 18px;
    }
    .deptTitle {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-en);
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.01em;
      text-align: start;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    html[lang="ar"] .deptTitle {
      font-family: var(--font-ar);
      letter-spacing: 0;
    }
    .deptSelfBadge {
      flex: 0 0 auto;
      padding: 1px 7px;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-pill);
      background: #eff6ff;
      color: var(--brand);
      font-size: 9px;
      font-weight: 800;
      line-height: 1.6;
      white-space: nowrap;
    }
    .deptCount {
      flex: 0 0 auto;
      min-width: 30px;
      padding: 3px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      color: var(--dept, #64748b);
      font-family: var(--font-en);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: color-mix(in srgb, var(--dept, #64748b) 10%, #fff);
      border-color: color-mix(in srgb, var(--dept, #64748b) 28%, #fff);
    }
    .empRow.type-annual {
      --accent: #059669;
      --accent-2: #34d399;
      --accent-soft: rgba(5, 150, 105, .45);
      --accent-past: #065f46;
    }
    .empRow.type-sick {
      --accent: #e11d48;
      --accent-2: #fb7185;
      --accent-soft: rgba(225, 29, 72, .42);
      --accent-past: #9f1239;
    }
    .leaveTag {
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-size: 9px;
      font-weight: 800;
      line-height: 1.6;
      white-space: nowrap;
    }
    .leaveTag.annual {
      border-color: #a7f3d0;
      background: #ecfdf5;
      color: #047857;
    }
    .leaveTag.sick {
      border-color: #fecdd3;
      background: #fff1f2;
      color: #be123c;
    }
    .empRow.is-expired .leaveTag {
      border-color: #e2e8f0;
      background: #f8fafc;
      color: #94a3b8;
    }
    .expiredSeparator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 6px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
    }
    .expiredSeparator::before,
    .expiredSeparator::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: #eef2f7;
    }

    .empRow { position: relative; padding: 8px 14px 9px; }
    .empRow + .empRow { border-top: 1px solid #f1f5f9; }
    .empRow.is-self {
      background: linear-gradient(to left, rgba(30, 64, 175, .065), rgba(30, 64, 175, .015));
    }
    html[lang="en"] .empRow.is-self {
      background: linear-gradient(to right, rgba(30, 64, 175, .065), rgba(30, 64, 175, .015));
    }
    .empRow.is-self::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 3px;
      background: var(--brand);
    }
    .empRow.is-expired {
      --accent: #94a3b8;
      --accent-2: #cbd5e1;
      --accent-soft: rgba(148, 163, 184, .28);
    }
    .empRow.is-expired .empName { color: #64748b; }
    .empHead {
      display: block;
    }
    .empNameLine {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      max-width: 100%;
      vertical-align: baseline;
    }
    .empNameId {
      display: flex;
      align-items: baseline;
      gap: 0;
      flex: 0 1 auto;
      min-width: 0;
      direction: ltr;
    }
    .nameDash {
      flex: 0 0 auto;
      color: #cbd5e1;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.3;
    }
    .empName {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      font-family: var(--font-en);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -.005em;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: ltr;
      unicode-bidi: isolate;
    }
    html[lang="ar"] .empNameId { direction: rtl; }
    html[lang="ar"] .empName {
      font-family: var(--font-ar);
      letter-spacing: 0;
      direction: rtl;
    }
    .empId {
      flex: 0 0 auto;
      color: #94a3b8;
      font-family: var(--font-en);
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .empDays {
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 800;
      line-height: 1.4;
      white-space: nowrap;
    }
    .empFacts {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px 6px;
      max-width: 100%;
      margin-inline-start: 8px;
      vertical-align: baseline;
    }
    .selfBadge {
      flex: 0 0 auto;
      padding: 1px 7px;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-pill);
      background: #eff6ff;
      color: var(--brand);
      font-size: 9px;
      font-weight: 800;
      line-height: 1.5;
      white-space: nowrap;
    }

    /* Full-width month ruler: a thin day rail, with day chips on top of it.
       The rail stays short — only the date boxes grow. */
    .shadowTrack {
      position: relative;
      min-width: 0;
      margin-top: 7px;
    }
    .monthTrack {
      position: relative;
      height: 18px;
      overflow: visible;
    }
    /* Thin 8px rail with one tick per day. */
    .monthTrack::before {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 5px;
      height: 8px;
      border-radius: var(--radius-pill);
      background-color: #f8fafc;
      background-image: repeating-linear-gradient(
        to left,
        transparent 0,
        transparent calc(var(--day, 3.3333%) - 1px),
        rgba(148, 163, 184, .22) calc(var(--day, 3.3333%) - 1px),
        rgba(148, 163, 184, .22) var(--day, 3.3333%)
      );
      box-shadow: inset 0 0 0 1px #eef2f7;
      pointer-events: none;
      z-index: 1;
    }
    /* Same day grid redrawn on top so the leave bar itself is split per day. */
    .monthTrack::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 5px;
      height: 8px;
      border-radius: var(--radius-pill);
      background-image: repeating-linear-gradient(
        to left,
        transparent 0,
        transparent calc(var(--day, 3.3333%) - 1px),
        rgba(255, 255, 255, .55) calc(var(--day, 3.3333%) - 1px),
        rgba(255, 255, 255, .55) var(--day, 3.3333%)
      );
      pointer-events: none;
      z-index: 3;
    }
    .trackSpan {
      position: absolute;
      top: 5px;
      bottom: 5px;
      inset-inline-start: var(--start, 0%);
      width: var(--w, 0%);
      min-width: 3px;
      border-radius: var(--radius-pill);
      background: linear-gradient(to left, var(--accent) 0%, var(--accent-2, var(--accent)) 100%);
      box-shadow: 0 4px 10px -3px var(--accent-soft);
      overflow: hidden;
      transform-origin: right center;
      animation: stretch .7s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: calc(var(--i, 0) * 30ms);
      z-index: 2;
    }
    html[lang="en"] .trackSpan {
      background: linear-gradient(to right, var(--accent) 0%, var(--accent-2, var(--accent)) 100%);
    }
    html[lang="en"] .trackSpan,
    html[lang="en"] .trackGap,
    html[lang="en"] .trackWork { transform-origin: left center; }
    /* Elapsed leave days use the deep tone. */
    .trackPast {
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      background: var(--accent-past, #334155);
    }
    .trackGap {
      position: absolute;
      inset-inline-start: var(--start, 0%);
      width: var(--w, 0%);
      min-width: 2px;
      top: 7px;
      bottom: 7px;
      border-radius: 3px;
      background: #cbd5e1;
      transform-origin: right center;
      animation: stretch .7s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: calc(var(--i, 0) * 30ms);
      z-index: 2;
    }
    /* Every day number sits in a square box on top of the rail:
       leave start/end (accent), back-to-work (blue), today (amber),
       and the month's first/last day (grey). */
    .trackChip {
      position: absolute;
      inset-inline-start: calc((var(--day-index, 1) - .5) * var(--day, 3.3333%));
      top: calc((100% - var(--chip-size, 18px)) / 2);
      width: var(--chip-size, 18px);
      height: var(--chip-size, 18px);
      margin-inline-start: calc(var(--chip-size, 18px) / -2);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-family: var(--font-en);
      font-size: var(--chip-font, 10.5px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      animation: pop .35s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: calc(var(--i, 0) * 30ms);
    }
    /* Leave start and end day, colored like the leave bar. */
    .trackChip.trackFrom,
    .trackChip.trackTo {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px -2px var(--accent-soft), 0 0 0 1.5px #fff;
      z-index: 5;
    }
    .trackChip.trackWork {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 2px 6px -1px rgba(37, 99, 235, .55), 0 0 0 1.5px #fff;
      z-index: 7;
    }
    .trackChip.trackToday {
      background: linear-gradient(to bottom, #fbbf24, #f59e0b);
      color: #fff;
      box-shadow: 0 2px 6px -1px rgba(245, 158, 11, .55), 0 0 0 1.5px #fff;
      z-index: 6;
    }
    /* Month first/last day stays quiet so it never competes with leave days. */
    .trackChip.trackEdge {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #94a3b8;
      z-index: 4;
    }
    .empRow.is-expired .trackGap { background: #e2e8f0; }
    .empRow.is-expired .trackChip.trackWork {
      background: #94a3b8;
      box-shadow: 0 0 0 1.5px #fff;
    }
    @keyframes stretch {
      from { transform: scaleX(0); opacity: .2; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes pop {
      from { transform: scale(.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .expiredTag {
      padding: 0 6px;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-pill);
      background: #f8fafc;
      color: #94a3b8;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.6;
      white-space: nowrap;
    }
    .empDate {
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.5;
      white-space: nowrap;
    }
    .empDate bdi {
      color: var(--text-secondary);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .empDate .gap { color: #cbd5e1; }

    /* ── States ── */
    .stateCard {
      padding: 28px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      text-align: center;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .stateIcon {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      color: #94a3b8;
    }
    .stateTitle {
      margin: 0 0 5px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .stateBody {
      margin: 0;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.6;
    }
    .retryBtn {
      margin-top: 14px;
      padding: 10px 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .retryBtn:active { transform: scale(.98); background: var(--surface-muted); }

    .skeleton {
      padding: 6px 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }
    .skRow { padding: 12px 14px; }
    .skRow + .skRow { border-top: 1px solid #f1f5f9; }
    .skLine {
      height: 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #f1f5f9 25%, #e8eef6 37%, #f1f5f9 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    .skLine + .skLine { margin-top: 7px; }
    .skLine.w55 { width: 55%; }
    .skLine.w30 { width: 30%; }
    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: 0 0; }
    }

    .pageFoot {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin: 10px 2px 0;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
    }

    @media (max-width: 520px) {
      /* Phones: name + ID on one line, details on a clean second line. */
      .empNameLine { display: flex; }
      .empFacts {
        display: flex;
        flex-wrap: wrap;
        margin-inline-start: 0;
        margin-top: 3px;
      }
      .leaveTag { display: none; }
    }
    @media (max-width: 380px) {
      .backBtnLabel { display: none; }
      .backBtn { min-width: 40px; padding: 0 9px; }
      .headerSpacer { width: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-delay: 0ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="headerTop">
        <a class="backBtn" href="../" id="backBtn" aria-label="رجوع">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
          <span class="backBtnLabel" id="backLabel">رجوع</span>
        </a>
        <h1 class="pageTitle" id="pageTitle">الإجازات</h1>
        <span class="headerSpacer" aria-hidden="true"></span>
      </div>
      <div class="headerBody">
        <div class="heroNum" id="heroNum">—</div>
        <div class="heroSide">
          <span class="heroLabel" id="heroLabel">جارٍ التحميل…</span>
          <span class="heroMonth" id="heroMonth"></span>
        </div>
      </div>
    </header>

    <div class="monthStripWrap">
      <div class="monthStrip" id="monthStrip" role="group" aria-label="اختيار الشهر"></div>
    </div>

    <div class="sourceTabs no-anim" id="sourceTabs" data-active="export" role="group" aria-label="مصدر الجدول">
      <button class="sourceTab is-active" type="button" data-source="export" aria-pressed="true">
        <span id="exportLabel">الصادر</span>
        <span class="sourceTabCount" data-count="export">0</span>
      </button>
      <button class="sourceTab" type="button" data-source="import" aria-pressed="false">
        <span id="importLabel">الوارد</span>
        <span class="sourceTabCount" data-count="import">0</span>
      </button>
    </div>

    <p class="srOnly" id="statusText" role="status" aria-live="polite"></p>

    <div class="skeleton" id="skeleton" aria-hidden="true">
      <div class="skRow"><div class="skLine w55"></div><div class="skLine w30"></div></div>
      <div class="skRow"><div class="skLine w55"></div><div class="skLine w30"></div></div>
      <div class="skRow"><div class="skLine w55"></div><div class="skLine w30"></div></div>
      <div class="skRow"><div class="skLine w55"></div><div class="skLine w30"></div></div>
    </div>

    <main class="listCard" id="listCard" hidden></main>

    <section class="stateCard" id="emptyState" hidden>
      <svg class="stateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <path d="M8 3v4M16 3v4M3 10h18"/>
        <path d="M9 15h6"/>
      </svg>
      <h2 class="stateTitle" id="emptyTitle">لا توجد إجازات مسجّلة</h2>
      <p class="stateBody" id="emptyBody">لا توجد إجازات سنوية أو مرضية في هذا الشهر.</p>
    </section>

    <section class="stateCard" id="errorState" hidden>
      <svg class="stateIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5"/>
        <path d="M12 16.5h.01"/>
      </svg>
      <h2 class="stateTitle" id="errorTitle">تعذّر تحميل البيانات</h2>
      <p class="stateBody" id="errorBody">تأكد من اتصالك بالإنترنت ثم أعد المحاولة.</p>
      <button type="button" class="retryBtn" id="retryBtn">إعادة المحاولة</button>
    </section>

    <footer class="pageFoot">
      <span id="footSource">المصدر: جداول الموظفين</span>
      <span id="updatedText"></span>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      var MONTHS = {
        ar: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'],
        en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
      };
      var LEAVE_LABELS = {
        ar: { annual: 'سنوية', sick: 'مرضية' },
        en: { annual: 'Annual', sick: 'Sick' }
      };
      var SOURCE_LABELS = {
        ar: { export: 'الصادر', import: 'الوارد' },
        en: { export: 'Export', import: 'Import' }
      };
      var T = {
        ar: {
          pageTitle: 'الإجازات',
          back: 'رجوع',
          monthGroup: 'اختيار الشهر',
          sourceGroup: 'مصدر الجدول',
          loading: 'جارٍ التحميل…',
          loadingStatus: 'جارٍ تحميل الإجازات…',
          emptyTitle: 'لا توجد إجازات مسجّلة',
          emptyBody: 'لا توجد إجازات سنوية أو مرضية في هذا الشهر.',
          errorTitle: 'تعذّر تحميل البيانات',
          errorBody: 'تأكد من اتصالك بالإنترنت ثم أعد المحاولة.',
          retry: 'إعادة المحاولة',
          source: 'المصدر: جداول الموظفين',
          updated: 'آخر تحديث: ',
          self: 'أنت',
          yourDept: 'قسمك',
          expired: 'منقضية',
          expiredGroup: 'إجازات منقضية',
          rest: 'راحة',
          backToWork: 'بداية الدوام',
          today: 'اليوم',
          leaveStart: 'بداية الإجازة',
          leaveEnd: 'نهاية الإجازة'
        },
        en: {
          pageTitle: 'Leaves',
          back: 'Back',
          monthGroup: 'Choose month',
          sourceGroup: 'Roster source',
          loading: 'Loading…',
          loadingStatus: 'Loading leaves…',
          emptyTitle: 'No recorded leaves',
          emptyBody: 'No annual or sick leave in this month.',
          errorTitle: 'Couldn\'t load the data',
          errorBody: 'Check your internet connection and try again.',
          retry: 'Try again',
          source: 'Source: employee schedules',
          updated: 'Last updated: ',
          self: 'You',
          yourDept: 'Your dept',
          expired: 'Expired',
          expiredGroup: 'Expired leaves',
          rest: 'Rest',
          backToWork: 'Back to work',
          today: 'Today',
          leaveStart: 'Leave starts',
          leaveEnd: 'Leave ends'
        }
      };
      var DEPT_AR = {
        'Supervisors': 'المشرفون',
        'Load Control': 'مراقبة الحمولة',
        'Export Checker': 'مدقق الصادرات',
        'Export Operators': 'مشغلو الصادرات',
        'Inventory': 'المخزون',
        'Officers': 'الضباط',
        'Documentation': 'المستندات',
        'Import Checkers': 'مدققو الواردات',
        'Release Control': 'مراقبة الإفراج',
        'Import Operators': 'مشغلو الواردات',
        'Flight Dispatch': 'تجهيز الرحلات',
        'Flight Dispatch (Export)': 'تجهيز الرحلات (الصادر)',
        'Flight Dispatch (Import)': 'تجهيز الرحلات (الوارد)',
        'Other': 'أخرى'
      };
      var DEPT_ORDER = [
        'supervisors',
        'load control',
        'export checker',
        'export operators',
        'inventory',
        'officers',
        'documentation',
        'import checkers',
        'release control',
        'import operators',
        'flight dispatch'
      ];
      var DEPT_COLORS = {
        'supervisors': '#0891b2',
        'load control': '#059669',
        'export checker': '#dc2626',
        'export operators': '#7c3aed',
        'inventory': '#ea580c',
        'officers': '#2563eb',
        'documentation': '#0891b2',
        'import checkers': '#059669',
        'release control': '#dc2626',
        'import operators': '#7c3aed',
        'flight dispatch': '#f59e0b'
      };

      var els = {
        backBtn: document.getElementById('backBtn'),
        backLabel: document.getElementById('backLabel'),
        pageTitle: document.getElementById('pageTitle'),
        heroNum: document.getElementById('heroNum'),
        heroLabel: document.getElementById('heroLabel'),
        heroMonth: document.getElementById('heroMonth'),
        strip: document.getElementById('monthStrip'),
        sourceTabs: document.getElementById('sourceTabs'),
        exportLabel: document.getElementById('exportLabel'),
        importLabel: document.getElementById('importLabel'),
        skeleton: document.getElementById('skeleton'),
        listCard: document.getElementById('listCard'),
        emptyState: document.getElementById('emptyState'),
        emptyTitle: document.getElementById('emptyTitle'),
        emptyBody: document.getElementById('emptyBody'),
        errorState: document.getElementById('errorState'),
        errorTitle: document.getElementById('errorTitle'),
        errorBody: document.getElementById('errorBody'),
        retryBtn: document.getElementById('retryBtn'),
        footSource: document.getElementById('footSource'),
        updatedText: document.getElementById('updatedText'),
        status: document.getElementById('statusText')
      };

      var DATA = null;
      var NAME_MAP = {};
      var updatedValue = '';
      var lang = 'ar';
      var activeMonth = '';
      var activeSource = 'export';
      var renderedDay = todayIso();
      var renderedSavedId = '';
      var sourceButtons = els.sourceTabs
        ? Array.prototype.slice.call(els.sourceTabs.querySelectorAll('.sourceTab'))
        : [];
      var sourceCounts = {};

      sourceButtons.forEach(function (button) {
        sourceCounts[button.getAttribute('data-source')] = button.querySelector('.sourceTabCount');
      });

      try {
        if (new URLSearchParams(location.search).get('source') === 'import') activeSource = 'import';
      } catch (e) {}
      updateSourceTabs(null);

      function span(className, text) {
        var el = document.createElement('span');
        el.className = className;
        if (text != null) el.textContent = text;
        return el;
      }

      function div(className) {
        var el = document.createElement('div');
        el.className = className;
        return el;
      }

      function numEl(value) {
        var el = document.createElement('bdi');
        el.textContent = String(value);
        return el;
      }

      function monthName(key) {
        return MONTHS[lang][parseInt(key.slice(5, 7), 10) - 1] || key;
      }

      function t(key) {
        return (T[lang] && T[lang][key]) || T.ar[key] || key;
      }

      function sourceLabel(kind) {
        return SOURCE_LABELS[lang][kind] || kind;
      }

      function deptLabel(raw) {
        var name = String(raw || '').trim() || 'Other';
        return lang === 'ar' ? (DEPT_AR[name] || name) : name;
      }

      function deptKey(dept) {
        return String(dept || '').trim().toLowerCase() || 'other';
      }

      function deptColor(dept) {
        return DEPT_COLORS[deptKey(dept)] || '#64748b';
      }

      function deptRank(dept) {
        var index = DEPT_ORDER.indexOf(deptKey(dept));
        return index === -1 ? DEPT_ORDER.length : index;
      }

      function displayName(raw) {
        var name = String(raw || '').trim();
        if (name && name === name.toUpperCase() && /[A-Z]/.test(name)) {
          return name.toLowerCase().replace(/(^|[\s\-'])([a-z])/g, function (match, prefix, letter) {
            return prefix + letter.toUpperCase();
          });
        }
        return name;
      }

      function nameFor(entry) {
        var raw = String(entry.name || '').trim();
        if (lang === 'ar' && NAME_MAP) {
          var key = raw.replace(/\s+/g, ' ').toUpperCase();
          if (NAME_MAP[key]) return NAME_MAP[key];
        }
        return displayName(raw);
      }

      function buildNameMap(json) {
        var map = {};
        var names = (json && json.names) || {};
        Object.keys(names).forEach(function (key) {
          map[String(key).replace(/\s+/g, ' ').trim().toUpperCase()] = names[key];
        });
        return map;
      }

      function readSavedIds() {
        var ids = [];
        function push(value) {
          var id = String(value || '').trim();
          if (/^\d+$/.test(id) && ids.indexOf(id) === -1) ids.push(id);
        }
        try {
          push(new URLSearchParams(location.search).get('emp'));
        } catch (e) {}
        ['exportSavedEmpId', 'savedEmpId', 'importSavedEmpId'].forEach(function (key) {
          try {
            push(localStorage.getItem(key));
          } catch (e) {}
        });
        return ids;
      }

      function todayIso() {
        var now = new Date();
        return now.getFullYear() + '-' +
          String(now.getMonth() + 1).padStart(2, '0') + '-' +
          String(now.getDate()).padStart(2, '0');
      }

      function isExpired(entry, today) {
        return (entry.actual_to || entry.to) < today;
      }

      function entriesForSource(month) {
        return ((month && month.entries) || []).filter(function (entry) {
          return (entry.kind || 'export') === activeSource;
        });
      }

      function peopleCount(entries) {
        var unique = {};
        entries.forEach(function (entry) { unique[entry.id] = true; });
        return Object.keys(unique).length;
      }

      function monthSourceCounts(month) {
        var seen = { export: {}, import: {} };
        ((month && month.entries) || []).forEach(function (entry) {
          var kind = entry.kind === 'import' ? 'import' : 'export';
          seen[kind][entry.id] = true;
        });
        return {
          export: Object.keys(seen.export).length,
          import: Object.keys(seen.import).length
        };
      }

      function updateSourceTabs(month) {
        var counts = monthSourceCounts(month);
        els.sourceTabs.setAttribute('data-active', activeSource);
        sourceButtons.forEach(function (button) {
          var kind = button.getAttribute('data-source') === 'import' ? 'import' : 'export';
          var on = kind === activeSource;
          button.classList.toggle('is-active', on);
          button.setAttribute('aria-pressed', on ? 'true' : 'false');
          button.setAttribute('aria-label', sourceLabel(kind) + ': ' + employeesPhrase(counts[kind]));
          if (sourceCounts[kind]) sourceCounts[kind].textContent = String(counts[kind]);
        });
      }

      function writeSourceUrl() {
        try {
          var params = new URLSearchParams(location.search);
          if (activeSource === 'import') params.set('source', 'import');
          else params.delete('source');
          var query = params.toString();
          history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + (location.hash || ''));
        } catch (e) {}
      }

      function setSource(source) {
        var next = source === 'import' ? 'import' : 'export';
        if (next === activeSource) return;
        els.sourceTabs.classList.remove('no-anim');
        activeSource = next;
        writeSourceUrl();
        if (!DATA) return;
        buildMonthStrip();
        renderMonth(DATA.months[activeMonth] ? activeMonth : initialMonth(), { announce: false });
      }

      function employeesPhrase(count) {
        if (lang === 'en') {
          if (!count) return 'No one on leave';
          return count + (count === 1 ? ' employee' : ' employees') + ' on leave';
        }
        if (!count) return 'لا أحد في إجازة';
        if (count === 1) return 'موظف واحد في إجازة';
        if (count === 2) return 'موظفان في إجازة';
        if (count <= 10) return count + ' موظفين في إجازة';
        return count + ' موظفًا في إجازة';
      }

      function heroLabelFor(count) {
        if (lang === 'en') {
          if (!count) return 'No leave';
          return count === 1 ? 'employee on leave' : 'employees on leave';
        }
        if (!count) return 'لا توجد إجازات';
        if (count === 1) return 'موظف في إجازة';
        if (count === 2) return 'موظفان في إجازة';
        if (count <= 10) return 'موظفين في إجازة';
        return 'موظفًا في إجازة';
      }

      function daysLabel(count) {
        if (lang === 'en') return count + (count === 1 ? ' day' : ' days');
        if (count === 1) return 'يوم واحد';
        if (count === 2) return 'يومان';
        if (count <= 10) return count + ' أيام';
        return count + ' يومًا';
      }

      function dateEl(entry, monthKey) {
        var wrap = span('empDate');
        var ranges = entry.ranges && entry.ranges.length
          ? entry.ranges
          : [{ from: entry.from, to: entry.to }];
        ranges.forEach(function (range, index) {
          if (index) wrap.appendChild(span('gap', ' · '));
          var fromDay = parseInt(range.from.slice(8, 10), 10);
          var toDay = parseInt(range.to.slice(8, 10), 10);
          wrap.appendChild(numEl(fromDay));
          if (fromDay !== toDay) {
            wrap.appendChild(document.createTextNode(' – '));
            wrap.appendChild(numEl(toDay));
          }
        });
        wrap.appendChild(document.createTextNode(' ' + monthName(monthKey)));
        return wrap;
      }

      function placeMark(ruler, className, fromDay, toDay, monthDays, index, title) {
        var mark = div(className);
        mark.style.setProperty('--start', (((fromDay - 1) / monthDays) * 100).toFixed(3) + '%');
        mark.style.setProperty('--w', (((toDay - fromDay + 1) / monthDays) * 100).toFixed(3) + '%');
        mark.style.setProperty('--i', String(Math.min(index, 14)));
        if (title) mark.title = title;
        ruler.appendChild(mark);
        return mark;
      }

      function placeChip(ruler, className, day, index, title, label) {
        var chip = div('trackChip ' + className);
        chip.style.setProperty('--day-index', String(day));
        chip.style.setProperty('--i', String(Math.min(index, 14)));
        chip.textContent = String(label);
        if (title) chip.title = title;
        ruler.appendChild(chip);
        return chip;
      }

      function markLeaveProgress(mark, fromDay, toDay, monthKey, today) {
        var todayMonth = today.slice(0, 7);
        var todayDay = parseInt(today.slice(8, 10), 10);
        var days = toDay - fromDay + 1;
        var pastDays = 0;
        if (monthKey < todayMonth) {
          pastDays = days;
        } else if (monthKey === todayMonth) {
          if (toDay < todayDay) pastDays = days;
          else if (fromDay < todayDay) pastDays = todayDay - fromDay;
        }
        if (pastDays > 0) {
          var past = span('trackPast');
          past.style.width = ((pastDays / days) * 100).toFixed(4) + '%';
          mark.appendChild(past);
        }
      }

      function buildRow(entry, index, monthDays, monthKey, isSelf, expired) {
        var row = document.createElement('article');
        row.className = 'empRow type-' + entry.type;
        if (isSelf) row.classList.add('is-self');
        if (expired) row.classList.add('is-expired');
        row.setAttribute('data-id', entry.id);

        var head = div('empHead');
        var nameLine = div('empNameLine');
        var nameId = div('empNameId');

        var display = nameFor(entry);
        var name = span('empName', display);
        name.title = display;
        nameId.appendChild(name);
        nameId.appendChild(span('nameDash', '-'));
        nameId.appendChild(span('empId', entry.id));
        nameLine.appendChild(nameId);
        if (isSelf) nameLine.appendChild(span('selfBadge', t('self')));
        head.appendChild(nameLine);

        var facts = div('empFacts');
        facts.appendChild(span('leaveTag ' + entry.type, LEAVE_LABELS[lang][entry.type] || ''));
        facts.appendChild(span('empDays', daysLabel(entry.days)));
        facts.appendChild(dateEl(entry, monthKey));
        if (expired) facts.appendChild(span('expiredTag', t('expired')));
        head.appendChild(facts);

        row.appendChild(head);

        var track = div('shadowTrack');
        track.setAttribute('aria-hidden', 'true');

        var ruler = div('monthTrack');
        ruler.style.setProperty('--day', (100 / monthDays).toFixed(4) + '%');
        track.setAttribute('data-days', String(monthDays));
        var ranges = entry.ranges && entry.ranges.length
          ? entry.ranges
          : [{ from: entry.from, to: entry.to }];
        var today = todayIso();
        var todayMonth = today.slice(0, 7);
        var todayDay = parseInt(today.slice(8, 10), 10);

        /* Day-number boxes: one box per day, highest priority wins. */
        var chips = [];
        function addChip(day, className, title, priority) {
          if (!day || day < 1 || day > monthDays) return;
          for (var c = 0; c < chips.length; c++) {
            if (chips[c].day === day) {
              if (priority > chips[c].priority) {
                chips[c].className = className;
                chips[c].title = title;
                chips[c].priority = priority;
              }
              return;
            }
          }
          chips.push({ day: day, className: className, title: title, priority: priority });
        }

        /* Month bounds first: they yield to any leave, work or today box. */
        addChip(1, 'trackEdge', null, 1);
        addChip(monthDays, 'trackEdge', null, 1);

        ranges.forEach(function (range, rangeIndex) {
          var fromDay = parseInt(range.from.slice(8, 10), 10);
          var toDay = parseInt(range.to.slice(8, 10), 10);
          var mark = placeMark(ruler, 'trackSpan', fromDay, toDay, monthDays, index + rangeIndex);
          if (!expired) markLeaveProgress(mark, fromDay, toDay, monthKey, today);
          addChip(
            fromDay, 'trackFrom',
            t('leaveStart') + ': ' + fromDay + ' ' + monthName(monthKey), 3
          );
          if (toDay !== fromDay) {
            addChip(
              toDay, 'trackTo',
              t('leaveEnd') + ': ' + toDay + ' ' + monthName(monthKey), 3
            );
          }
        });

        (entry.returns || []).forEach(function (ret, returnIndex) {
          var delay = index + ranges.length + returnIndex;
          if (ret.gap_from && ret.gap_to) {
            var gapFrom = parseInt(ret.gap_from.slice(8, 10), 10);
            var gapTo = parseInt(ret.gap_to.slice(8, 10), 10);
            placeMark(
              ruler, 'trackGap', gapFrom, gapTo, monthDays, delay,
              t('rest') + ': ' + gapFrom + ' – ' + gapTo + ' ' + monthName(monthKey)
            );
          }
          if (ret.work) {
            var workDay = parseInt(ret.work.slice(8, 10), 10);
            addChip(
              workDay, 'trackWork',
              t('backToWork') + ': ' + workDay + ' ' + monthName(monthKey), 5
            );
          }
        });

        /* Today owns its column and outranks every other box. */
        if (todayMonth === monthKey) {
          addChip(
            todayDay, 'trackToday',
            t('today') + ': ' + todayDay + ' ' + monthName(monthKey), 6
          );
        }

        chips.forEach(function (chip, chipIndex) {
          placeChip(ruler, chip.className, chip.day, chipIndex, chip.title, chip.day);
        });

        track.appendChild(ruler);

        row.appendChild(track);
        return row;
      }

      function renderList(month, monthKey) {
        var entries = entriesForSource(month);
        var today = todayIso();
        var savedIds = readSavedIds();
        var savedId = '';
        for (var i = 0; i < savedIds.length; i++) {
          if (entries.some(function (entry) { return String(entry.id) === savedIds[i]; })) {
            savedId = savedIds[i];
            break;
          }
        }
        if (!savedId) savedId = savedIds[0] || '';

        function isSelfEntry(entry) {
          return !!savedId && String(entry.id) === savedId;
        }

        var byDept = {};
        entries.forEach(function (entry) {
          var name = String(entry.dept || '').trim() || 'Other';
          var key = deptKey(name);
          if (!byDept[key]) byDept[key] = { name: name, entries: [] };
          byDept[key].entries.push(entry);
        });

        var departments = Object.keys(byDept).map(function (key) {
          var group = byDept[key];
          var selfEntries = group.entries.filter(isSelfEntry);
          var otherEntries = group.entries.filter(function (entry) {
            return !isSelfEntry(entry);
          });
          var activeOthers = otherEntries.filter(function (entry) {
            return !isExpired(entry, today);
          });
          var expiredOthers = otherEntries.filter(function (entry) {
            return isExpired(entry, today);
          });
          return {
            name: group.name,
            entries: selfEntries.concat(activeOthers, expiredOthers),
            isSelf: selfEntries.length > 0,
            activeOthers: activeOthers.length,
            hasActive: group.entries.some(function (entry) {
              return !isExpired(entry, today);
            })
          };
        });

        departments.sort(function (a, b) {
          if (a.isSelf !== b.isSelf) return a.isSelf ? -1 : 1;
          if (a.hasActive !== b.hasActive) return a.hasActive ? -1 : 1;
          var rank = deptRank(a.name) - deptRank(b.name);
          if (rank) return rank;
          return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
        });

        var frag = document.createDocumentFragment();
        departments.forEach(function (dept) {
          var section = document.createElement('section');
          section.className = 'deptCard';
          section.style.setProperty('--dept', deptColor(dept.name));

          var unique = {};
          dept.entries.forEach(function (entry) { unique[entry.id] = true; });
          var people = Object.keys(unique).length;
          section.setAttribute('aria-label', deptLabel(dept.name) + (lang === 'ar' ? '، ' : ', ') + employeesPhrase(people));

          var head = div('deptHead');
          var icon = div('deptIcon');
          icon.setAttribute('aria-hidden', 'true');
          icon.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 21h18M3 10h18M5 21V10l7-6 7 6v11"/>' +
            '<rect x="9" y="14" width="2" height="3"/>' +
            '<rect x="13" y="14" width="2" height="3"/></svg>';
          head.appendChild(icon);

          var title = document.createElement('h2');
          title.className = 'deptTitle';
          title.textContent = deptLabel(dept.name);
          title.title = deptLabel(dept.name);
          head.appendChild(title);

          if (dept.isSelf) head.appendChild(span('deptSelfBadge', t('yourDept')));

          var count = span('deptCount', String(people));
          count.title = lang === 'en'
            ? people + (people === 1 ? ' employee' : ' employees')
            : people + ' موظف';
          head.appendChild(count);

          section.appendChild(head);

          var showedExpiredHead = false;
          dept.entries.forEach(function (entry, index) {
            var self = isSelfEntry(entry);
            var expired = isExpired(entry, today);
            if (expired && !self && dept.activeOthers && !showedExpiredHead) {
              section.appendChild(div('expiredSeparator')).textContent = t('expiredGroup');
              showedExpiredHead = true;
            }
            section.appendChild(buildRow(entry, index, month.days, monthKey, self, expired));
          });
          frag.appendChild(section);
        });

        els.listCard.innerHTML = '';
        els.listCard.appendChild(frag);
        fitChips();
      }

      /* Day boxes must stay squares that fit inside a single day cell.
         Measured once per render (and on resize) so numbers never collide. */
      function fitChips() {
        if (!els.listCard) return;
        var ruler = els.listCard.querySelector('.monthTrack');
        if (!ruler) return;
        var days = 30;
        try {
          var probe = ruler.parentNode && ruler.parentNode.getAttribute('data-days');
          if (probe) days = parseInt(probe, 10) || 30;
        } catch (e) {}
        var dayPx = ruler.getBoundingClientRect().width / days;
        var size = Math.max(10, Math.min(18, Math.floor(dayPx)));
        var font = size <= 12 ? 8 : (size <= 15 ? 9 : 10.5);
        els.listCard.style.setProperty('--chip-size', size + 'px');
        els.listCard.style.setProperty('--chip-font', font + 'px');
      }

      function updateStripActive() {
        var chips = els.strip.querySelectorAll('.monthChip');
        for (var i = 0; i < chips.length; i++) {
          var isActive = chips[i].getAttribute('data-month') === activeMonth;
          chips[i].classList.toggle('is-active', isActive);
          chips[i].setAttribute('aria-pressed', isActive ? 'true' : 'false');
        }
        var activeChip = els.strip.querySelector('.monthChip.is-active');
        if (activeChip) {
          try {
            activeChip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
          } catch (e) {
            activeChip.scrollIntoView();
          }
        }
      }

      function renderMonth(monthKey, options) {
        var month = DATA && DATA.months && DATA.months[monthKey];
        if (!month) return;

        activeMonth = monthKey;
        renderedDay = todayIso();
        renderedSavedId = readSavedIds().join(',');
        var entries = entriesForSource(month);
        var people = peopleCount(entries);

        updateSourceTabs(month);
        els.heroNum.textContent = String(people);
        els.heroLabel.textContent = heroLabelFor(people);
        els.heroMonth.textContent = monthName(monthKey) + ' ' + monthKey.slice(0, 4);

        updateStripActive();

        var isEmpty = entries.length === 0;
        els.emptyState.hidden = !isEmpty;
        els.listCard.hidden = isEmpty;
        if (isEmpty) {
          els.listCard.innerHTML = '';
          els.emptyBody.textContent = lang === 'en'
            ? 'No leaves recorded in ' + sourceLabel(activeSource) + ' for ' + monthName(monthKey) + '.'
            : 'لا توجد إجازات مسجّلة في ' + sourceLabel(activeSource) + ' خلال ' + monthName(monthKey) + '.';
        } else {
          renderList(month, monthKey);
        }

        if (!options || options.updateHash !== false) {
          try {
            history.replaceState(null, '', '#' + monthKey);
          } catch (e) {}
        }
        if (!options || options.announce !== false) {
          els.status.textContent = lang === 'en'
            ? monthName(monthKey) + ', ' + sourceLabel(activeSource) + ': ' + employeesPhrase(people) + '.'
            : 'شهر ' + monthName(monthKey) + '، ' + sourceLabel(activeSource) + ': ' + employeesPhrase(people) + '.';
        }
      }

      function buildMonthStrip() {
        els.strip.innerHTML = '';
        Object.keys(DATA.months).sort().forEach(function (key) {
          var month = DATA.months[key];
          var people = peopleCount(entriesForSource(month));

          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'monthChip';
          chip.setAttribute('data-month', key);
          chip.setAttribute('aria-label', monthName(key) + (lang === 'ar' ? '، ' : ', ') + sourceLabel(activeSource) + ': ' + employeesPhrase(people));
          if (!people) chip.classList.add('is-empty');
          chip.appendChild(span('chipMonth', monthName(key)));
          chip.appendChild(span('chipCount', String(people)));
          chip.addEventListener('click', function () {
            if (key !== activeMonth) renderMonth(key);
          });
          els.strip.appendChild(chip);
        });
      }

      function initialMonth() {
        var hash = (location.hash || '').replace('#', '');
        if (DATA.months[hash]) return hash;

        var now = new Date();
        var current = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        if (DATA.months[current]) return current;

        var withEntries = Object.keys(DATA.months).sort().filter(function (key) {
          return entriesForSource(DATA.months[key]).length > 0;
        });
        if (withEntries.length) return withEntries[withEntries.length - 1];
        return Object.keys(DATA.months).sort().pop();
      }

      function readStoredLang() {
        try {
          return localStorage.getItem('rosterLang') === 'en' ? 'en' : 'ar';
        } catch (e) {
          return 'ar';
        }
      }

      function applyLanguage(next) {
        lang = next === 'en' ? 'en' : 'ar';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        document.body.classList.toggle('ar', lang === 'ar');
        document.title = t('pageTitle');
        els.pageTitle.textContent = t('pageTitle');
        els.backLabel.textContent = t('back');
        els.backBtn.setAttribute('aria-label', t('back'));
        els.exportLabel.textContent = SOURCE_LABELS[lang].export;
        els.importLabel.textContent = SOURCE_LABELS[lang].import;
        els.strip.setAttribute('aria-label', t('monthGroup'));
        els.sourceTabs.setAttribute('aria-label', t('sourceGroup'));
        els.emptyTitle.textContent = t('emptyTitle');
        els.emptyBody.textContent = t('emptyBody');
        els.errorTitle.textContent = t('errorTitle');
        els.errorBody.textContent = t('errorBody');
        els.retryBtn.textContent = t('retry');
        els.footSource.textContent = t('source');
        if (updatedValue) showUpdated(updatedValue);
        if (DATA) {
          buildMonthStrip();
          renderMonth(DATA.months[activeMonth] ? activeMonth : initialMonth(), { updateHash: false, announce: false });
        }
      }

      function setLoading(on) {
        els.skeleton.hidden = !on;
        els.errorState.hidden = true;
        els.listCard.hidden = true;
        els.emptyState.hidden = true;
        els.heroNum.textContent = '—';
        els.heroLabel.textContent = on ? t('loading') : '';
        els.heroMonth.textContent = '';
        if (on) els.status.textContent = t('loadingStatus');
      }

      function showError() {
        els.skeleton.hidden = true;
        els.listCard.hidden = true;
        els.emptyState.hidden = true;
        els.errorState.hidden = false;
        els.heroNum.textContent = '—';
        els.heroLabel.textContent = t('errorTitle');
        els.heroMonth.textContent = '';
        els.status.textContent = t('errorTitle') + '.';
      }

      function showUpdated(value) {
        if (!value) return;
        var date = new Date(value);
        if (isNaN(date.getTime())) return;
        updatedValue = value;
        els.updatedText.textContent = t('updated') +
          date.getDate() + ' ' + MONTHS[lang][date.getMonth()] + ' ' + date.getFullYear();
      }

      function load() {
        setLoading(true);
        Promise.all([
          fetch('leaves-data.json', { cache: 'no-cache' })
            .then(function (response) {
              if (!response.ok) throw new Error('HTTP ' + response.status);
              return response.json();
            }),
          fetch('../name_translations.json', { cache: 'no-store' })
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .catch(function () {
              return null;
            })
        ])
          .then(function (results) {
            var data = results[0];
            if (!data || !data.months || !Object.keys(data.months).length) {
              throw new Error('No leave data');
            }
            NAME_MAP = buildNameMap(results[1]);
            DATA = data;
            buildMonthStrip();
            renderMonth(initialMonth(), { announce: false });
            els.skeleton.hidden = true;
            els.errorState.hidden = true;
            showUpdated(data.generated_at);
          })
          .catch(function () {
            showError();
          });
      }

      els.retryBtn.addEventListener('click', load);
      sourceButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          setSource(button.getAttribute('data-source'));
        });
      });
      window.addEventListener('hashchange', function () {
        var key = (location.hash || '').replace('#', '');
        if (DATA && DATA.months[key] && key !== activeMonth) {
          renderMonth(key, { updateHash: false });
        }
      });

      function refreshView() {
        if (!DATA || !activeMonth) return;
        renderMonth(activeMonth, { updateHash: false, announce: false });
      }

      function refreshIfNeeded(force) {
        if (!DATA || !activeMonth) return;
        var stored = readStoredLang();
        if (stored !== lang) {
          applyLanguage(stored);
          return;
        }
        if (
          force ||
          todayIso() !== renderedDay ||
          readSavedIds().join(',') !== renderedSavedId
        ) {
          refreshView();
        }
      }

      window.addEventListener('storage', function (e) {
        if (!e) return;
        if (e.key === 'rosterLang') {
          var next = e.newValue === 'en' ? 'en' : 'ar';
          if (next !== lang) applyLanguage(next);
          return;
        }
        if (['exportSavedEmpId', 'savedEmpId', 'importSavedEmpId'].indexOf(e.key) !== -1) {
          refreshIfNeeded(true);
        }
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshIfNeeded(false);
      });
      window.addEventListener('pageshow', function (e) {
        if (e && e.persisted) refreshIfNeeded(true);
      });
      /* Rail width changes with the viewport; keep the day boxes square. */
      var fitTimer = 0;
      window.addEventListener('resize', function () {
        if (fitTimer) clearTimeout(fitTimer);
        fitTimer = setTimeout(fitChips, 120);
      });

      applyLanguage(readStoredLang());
      load();
    })();
  </script>
</body>
</html>
