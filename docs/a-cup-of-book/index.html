<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script defer src="../ios-tap-fix.js?v=20260803f"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Cup of Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#eef1f7;color:#18243a;
      font-family:'IBM Plex Sans Arabic','DM Sans',Tahoma,sans-serif;
      min-height:100dvh;
    }
    .wrap{
      width:100%;
      max-width:820px;
      margin:0 auto;
      padding:14px 14px 28px;
      padding-top:calc(14px + env(safe-area-inset-top,0px));
      padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
    }

    /* ── Header ── */
    .header{
      position:relative;overflow:hidden;flex-shrink:0;
      padding:18px 16px 14px;
      border-radius:18px;
      background:linear-gradient(135deg,#1e40af 0%,#1976d2 50%,#0ea5e9 100%);
      box-shadow:0 4px 16px rgba(30,64,175,.22);
      text-align:center;
    }
    .header::before{
      content:'';position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 84% 18%,rgba(255,255,255,.18) 0%,transparent 34%),
                 radial-gradient(circle at 14% 90%,rgba(255,255,255,.10) 0%,transparent 28%);
    }
    .hCircle{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
    .hCircle1{width:200px;height:200px;right:-60px;top:-70px}
    .hCircle2{width:120px;height:120px;right:70px;bottom:-50px}

    /* ── Header text ── */
    .heroText{position:relative;z-index:1;text-align:center}
    .heroText h1{font:900 24px/1.05 'Sora',sans-serif;color:#fff;letter-spacing:-.04em;margin:0}
    .heroText p{margin:4px 0 0;font-size:11px;color:rgba(255,255,255,.78);font-weight:700}

    /* ── Train strip (inside header) ── */
    .trainStrip{
      position:relative;z-index:1;
      margin-top:12px;
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      justify-content:center;
    }
    .car-btn{
      position:relative;
      width:56px;height:56px;padding:3px;
      border-radius:10px;border:2px solid rgba(255,255,255,.20);
      background:rgba(255,255,255,.10);
      cursor:pointer;transition:.18s;overflow:hidden;flex-shrink:0;
    }
    .car-btn img{
      width:100%;height:100%;object-fit:cover;
      border-radius:7px;display:block;
    }
    .car-btn.active{
      border-color:#fff;
      transform:scale(1.12) translateY(-2px);
      box-shadow:0 6px 18px rgba(0,0,0,.30);
    }
    .car-btn:hover:not(.active){
      border-color:rgba(255,255,255,.55);
      transform:scale(1.06);
    }
    .car-btn.is-new{
      border-color:rgba(253,224,71,.95);
      box-shadow:0 0 0 2px rgba(245,158,11,.35);
    }
    .car-new-badge{
      position:absolute;top:2px;inset-inline-start:2px;z-index:2;
      padding:2px 5px;border-radius:999px;
      background:linear-gradient(135deg,#f59e0b,#ef4444);
      color:#fff;font-size:8px;font-weight:900;line-height:1.1;
      letter-spacing:.2px;
      box-shadow:0 2px 6px rgba(0,0,0,.25);
      pointer-events:none;
    }

    /* ── Header quick links ── */
    .quickLinks{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;
      margin-top:10px;position:relative;z-index:1;
    }
    .quickBtn{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 12px;border-radius:999px;
      background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
      color:rgba(255,255,255,.92);font-size:11px;font-weight:800;
      text-decoration:none;transition:.2s;
      cursor:pointer;font:inherit;
    }
    .quickBtn:hover{background:rgba(255,255,255,.25)}
    button.quickBtn{appearance:none;-webkit-appearance:none}

    /* ── Viewer: centered, readable width ── */
    .viewer{
      width:100%;
      margin:14px auto 0;
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 8px 28px rgba(24,36,58,.12);
      border:1px solid rgba(24,36,58,.08);
    }
    .viewer-screen{
      width:100%;
      background:#f4f6fb;
      padding:12px 12px 0;
      line-height:0;
      display:flex;
      justify-content:center;
    }
    .viewer-screen img{
      width:100%;
      max-width:560px;
      height:auto;
      display:block;
      margin:0 auto;
      border-radius:10px;
      box-shadow:0 4px 18px rgba(12,18,34,.14);
    }
    .viewer-bar{
      flex-shrink:0;
      background:#fff;
      padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
      border-top:1px solid rgba(0,0,0,.06);
    }
    .viewer-label{
      font-size:12px;font-weight:700;color:#6b7a96;
      letter-spacing:.02em;order:2;
    }
    .viewer-nav{
      display:flex;align-items:center;justify-content:center;gap:12px;
      order:1;
    }
    .nav-btn{
      min-width:118px;
      padding:10px 20px;
      border-radius:999px;
      font:800 13px/1 'Plus Jakarta Sans','Sora',sans-serif;
      border:none;
      background:linear-gradient(135deg,#1e40af 0%,#1976d2 55%,#0ea5e9 100%);
      color:#fff;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(30,64,175,.28);
      transition:transform .15s,box-shadow .15s,filter .15s;
    }
    .nav-btn:hover{
      filter:brightness(1.06);
      box-shadow:0 8px 20px rgba(30,64,175,.34);
      transform:translateY(-1px);
    }
    .nav-btn:active{transform:translateY(0);filter:brightness(.98)}

    /* ── Empty ── */
    .empty{
      display:none;
      margin-top:14px;
      padding:28px 16px;text-align:center;
      color:#6b7a96;font-size:13px;
      background:#fff;
      border-radius:16px;
    }

    @media(max-width:480px){
      .wrap{padding:10px 10px 22px}
      .car-btn{width:46px;height:46px}
      .heroText h1{font-size:20px}
      .viewer-screen{padding:8px 8px 0}
      .viewer-screen img{max-width:100%;border-radius:8px}
    }
  
.titleWithIcon{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.titleWithIcon .titleIcon{line-height:0;display:inline-flex}
.titleWithIcon .titleIcon svg{display:block}
.quickBtn{display:inline-flex;align-items:center;gap:6px}
.quickBtn-icon{line-height:0;display:inline-flex;flex-shrink:0}
.quickBtn-icon svg{display:block}
.rosterIconWrap,.dockValue.searchGlyph,.savedIcon,.backIcon,.courseIcon{
  line-height:0;display:inline-flex;align-items:center;justify-content:center
}
.rosterIconWrap svg,.dockValue.searchGlyph svg,.savedIcon svg,.backIcon svg{display:block}
.courseIcon{font-size:0;color:var(--accent,#2563eb)}
.courseIcon svg{display:block}
.peopleBadge .peopleIconSvg{display:inline-block;vertical-align:-2px;margin-inline-end:3px}
.badge.peopleBadge{display:inline-flex;align-items:center;gap:4px}

</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="hCircle hCircle1"></div>
    <div class="hCircle hCircle2"></div>

    <div class="heroText">
      <h1>A Cup of Book</h1>
      <p>Tap a cover to read</p>
    </div>

    <!-- Train strip of thumbnails -->
    <div class="trainStrip" id="trainStrip"></div>

    <div class="quickLinks">
      <button type="button" class="quickBtn" id="shareBookBtn" aria-label="مشاركة الصفحة">
        <span class="quickBtn-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12M8 7l4-4 4 4"/></svg></span>
        <span>مشاركة</span>
      </button>
      <a class="quickBtn" href="../training/"><span class="quickBtn-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span>Training schedule</span></a>
      <a class="quickBtn" href="../" aria-label="العودة إلى الروستر الصادر"><span class="quickBtn-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 12l-3.5-1.5L3 3l4 12 4-1 2.5 3.5 3.5 1.8 4.2z"/></svg></span><span>الصادر</span></a>
      <a class="quickBtn" href="../import/" aria-label="الذهاب إلى الروستر الوارد"><span class="quickBtn-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 12l-3.5-1.5L3 3l4 12 4-1 2.5 3.5 3.5 1.8 4.2z"/></svg></span><span>الوارد</span></a>
    </div>
  </div>

  <!-- Large viewer -->
  <div class="viewer" id="viewer" style="display:none">
    <div class="viewer-screen">
      <img id="bigImg" src="" alt="Book page">
    </div>
    <div class="viewer-bar">
      <span class="viewer-label" id="viewerLabel"></span>
      <div class="viewer-nav">
        <button class="nav-btn" onclick="nav(-1)">◀ Prev</button>
        <button class="nav-btn" onclick="nav(1)">Next ▶</button>
      </div>
    </div>
  </div>

  <div class="empty" id="empty">No images found in the local gallery.</div>

</div>

<script>
(function(){
  var FILES = ["cup_of_book_01.jpg", "cup_of_book_02.jpg", "cup_of_book_03.jpg", "cup_of_book_04.jpg", "cup_of_book_05.jpg", "cup_of_book_06.jpg", "cup_of_book_07.jpg", "cup_of_book_09.jpg", "cup_of_book_10.jpg", "cup_of_book_11.jpg", "cup_of_book_12.jpg", "cup_of_book_13.jpg"];
  // Newest topic first (highest cup_of_book_NN number)
  FILES.sort(function(a, b) {
    var na = parseInt((a.match(/(\d+)/) || [0, 0])[1], 10);
    var nb = parseInt((b.match(/(\d+)/) || [0, 0])[1], 10);
    return nb - na;
  });
  var BASE = 'images/';
  var loaded = [];
  var cur = 0;

  var strip   = document.getElementById('trainStrip');
  var viewer  = document.getElementById('viewer');
  var bigImg  = document.getElementById('bigImg');
  var lbl     = document.getElementById('viewerLabel');
  var empty   = document.getElementById('empty');

  function selectIdx(i) {
    if (!loaded.length) return;
    cur = i;
    strip.querySelectorAll('.car-btn').forEach(function(b, idx) {
      b.classList.toggle('active', idx === i);
    });
    bigImg.src = loaded[i].src;
    var label = 'Book ' + String(i + 1).padStart(2, '0') + ' of ' + loaded.length;
    if (i === 0) label = 'جديد · ' + label;
    lbl.textContent = label;
    viewer.style.display = 'block';
  }

  window.nav = function(dir) {
    if (!loaded.length) return;
    selectIdx((cur + dir + loaded.length) % loaded.length);
  };

  FILES.forEach(function(name, idx) {
    var src = BASE + name;
    loaded.push({ src: src, name: name });

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'car-btn' + (idx === 0 ? ' is-new' : '');
    btn.title = idx === 0 ? 'جديد · أحدث موضوع' : ('Book ' + (idx + 1));
    btn.innerHTML =
      (idx === 0 ? '<span class="car-new-badge">جديد</span>' : '') +
      '<img src="' + src + '" alt="Book ' + (idx + 1) + '" loading="' + (idx < 3 ? 'eager' : 'lazy') + '">';
    btn.addEventListener('click', function(){ selectIdx(idx); });
    strip.appendChild(btn);
  });

  if (loaded.length) {
    selectIdx(0);
  } else {
    empty.style.display = 'block';
  }

  // Share (same banner pill style)
  var shareBtn = document.getElementById('shareBookBtn');
  if (shareBtn) {
    shareBtn.addEventListener('click', function() {
      var url = location.href.split('#')[0];
      var title = 'A Cup of Book';
      var text = 'A Cup of Book — أحدث موضوع في القائمة';
      if (navigator.share) {
        navigator.share({ title: title, text: text, url: url }).catch(function(){});
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          var label = shareBtn.querySelector('span:last-child');
          if (label) {
            var prev = label.textContent;
            label.textContent = 'تم النسخ';
            setTimeout(function(){ label.textContent = prev; }, 1400);
          }
        }).catch(function() {
          window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
        });
        return;
      }
      window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
    });
  }
})();
</script>
<script defer src="../site-visits.js?v=20260809a"></script>
</body>
</html>
