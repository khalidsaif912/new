<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>With me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="../ios-tap-fix.js?v=20260830wm"></script>
  <script src="../emp-id-gate.js?v=20260730a"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-en: 'IBM Plex Sans', Inter, system-ui, -apple-system, sans-serif;
      --font-ar: 'IBM Plex Sans Arabic', Cairo, Tahoma, sans-serif;
      --brand: #1e40af;
      --brand-soft: #dbeafe;
      --brand-ring: rgba(30, 64, 175, .22);
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --space-xs: 6px;
      --space-sm: 10px;
      --space-md: 14px;
      --space-lg: 18px;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, .06);
      --shadow-self: 0 4px 14px rgba(30, 64, 175, .12);
      --dept-officers: #2563eb;
      --dept-supervisors: #0891b2;
      --dept-load: #059669;
      --dept-checker: #6366f1;
      --dept-ops: #7c3aed;
      --dept-flight: #0d9488;
      --dept-flta: #d97706;
      --dept-default: #64748b;
    }

    html, body { width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #eef1f7;
      font-family: var(--font-en);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body.ar,
    html[lang="ar"] body {
      font-family: var(--font-ar);
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
      padding:
        calc(var(--space-sm) + var(--safe-top))
        var(--space-md)
        calc(var(--space-lg) + var(--safe-bottom));
      /* Vertical scroll stays with the browser; horizontal swipe is ours. */
      touch-action: pan-y;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(160deg, #1e3a8a 0%, var(--brand) 55%, #2563eb 100%);
      color: #fff;
      min-height: 166px;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 18px rgba(30, 64, 175, .18);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset-block-start: -48px;
      inset-inline-end: -52px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
      pointer-events: none;
    }

    .headerTop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-sm);
      position: relative;
      z-index: 2;
      direction: ltr;
    }

    .headerIdentity {
      position: relative;
      z-index: 2;
      padding: 4px 0 10px;
      width: max-content;
      max-width: min(72%, 280px);
      text-align: left;
      margin-right: auto;
      margin-left: 0;
    }
    body.ar .headerIdentity,
    html[lang="ar"] .headerIdentity {
      text-align: right;
      margin-left: auto;
      margin-right: 0;
    }

    .backBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 40px;
      min-height: 40px;
      padding: 0 12px 0 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .24);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .12);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .backBtn:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .34);
    }
    .backBtn:active { transform: scale(.97); }
    .backBtnIcon {
      display: block;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
    }
    .backBtnLabel {
      line-height: 1;
      white-space: nowrap;
    }

    .langToggle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 40px;
      min-height: 40px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .24);
      color: #fff;
      font-size: 0;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .12);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .langToggle:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .34);
    }
    .langToggle:active { transform: scale(.97); }
    .langToggle-icon {
      line-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .langToggle-icon svg {
      display: block;
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
    }
    .langToggle-label {
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }

    .headerBody {
      position: absolute;
      inset-block: 44px 8px;
      inset-inline: 12px;
      z-index: 1;
      padding: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .empNameHeader {
      margin: 0;
      font-size: clamp(18px, 4.8vw, 22px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.01em;
      color: #fff;
      word-break: break-word;
      text-shadow: 0 1px 10px rgba(15, 23, 42, .28);
    }
    body.ar .empNameHeader { letter-spacing: 0; }

    .pageSubtitle {
      margin: 3px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, .9);
      line-height: 1.3;
      text-shadow: 0 1px 8px rgba(15, 23, 42, .25);
    }

    .dateNav {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    .datePickerWrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 100%;
      pointer-events: auto;
    }
    .dateTag {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      user-select: none;
      text-align: center;
      line-height: 1;
    }
    .dateTagMain {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: flex-end;
      justify-content: stretch;
      gap: .2em;
      pointer-events: none;
      padding-bottom: 0;
      direction: ltr;
      width: 100%;
      max-width: 100%;
      margin-inline: 0;
    }
    body.ar .dateTagMain,
    html[lang="ar"] .dateTagMain {
      direction: rtl;
    }
    .dateTagSide {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: .14em;
      line-height: 1;
      padding-bottom: .08em;
      flex: 0 0 auto;
      width: max-content;
      direction: ltr;
      unicode-bidi: isolate;
      grid-column: 3;
      justify-self: start;
    }
    body.ar .dateTagSide,
    html[lang="ar"] .dateTagSide {
      align-items: flex-end;
      grid-column: 1;
      justify-self: end;
    }
    .dateTagWeek {
      display: block;
      font-size: clamp(14px, 4.2vw, 18px);
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.05;
      color: rgba(255, 255, 255, .14);
      text-align: left;
      white-space: nowrap;
      width: 100%;
    }
    body.ar .dateTagWeek {
      letter-spacing: 0;
      text-align: right;
    }
    .dateTagDay {
      display: block;
      font-size: clamp(72px, 26vw, 112px);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: .9;
      color: rgba(255, 255, 255, .16);
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
      grid-column: 2;
      justify-self: center;
    }
    body.ar .dateTagDay { letter-spacing: 0; }
    .dateTagMonthWrap {
      display: block;
      line-height: 1;
      text-align: left;
      width: 100%;
    }
    body.ar .dateTagMonthWrap,
    html[lang="ar"] .dateTagMonthWrap {
      text-align: right;
    }
    .dateTagMonth {
      display: block;
      font-size: clamp(28px, 10vw, 42px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      color: rgba(255, 255, 255, .14);
      text-transform: none;
      text-align: left;
      white-space: nowrap;
    }
    body.ar .dateTagMonth {
      letter-spacing: 0;
      text-align: right;
    }
    .datePickerWrapper #datePicker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 16px;
      border: none;
    }

    /* ── Shift strip under banner ── */
    .shiftStripWrap {
      margin-block: var(--space-sm) 0;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }
    .shiftStrip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 2px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .shiftStrip.is-dragging {
      cursor: grabbing;
      scroll-snap-type: none;
    }
    .shiftStrip::-webkit-scrollbar { display: none; }

    .shiftDay {
      flex: 0 0 auto;
      width: 54px;
      min-height: 64px;
      padding: 8px 4px 7px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: inherit;
      scroll-snap-align: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x;
      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;
    }
    .shiftDay:active { transform: scale(.96); }
    .shiftDayNum {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .shiftDayWeek {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1;
    }
    .shiftDayCode {
      margin-block-start: 2px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shiftDay.sg-morning {
      background: linear-gradient(180deg, #fffbeb 0%, #fff 70%);
      border-color: #fde68a;
    }
    .shiftDay.sg-morning .shiftDayCode { color: #b45309; }
    .shiftDay.sg-afternoon {
      background: linear-gradient(180deg, #fff7ed 0%, #fff 70%);
      border-color: #fed7aa;
    }
    .shiftDay.sg-afternoon .shiftDayCode { color: #c2410c; }
    .shiftDay.sg-night {
      background: linear-gradient(180deg, #f5f3ff 0%, #fff 70%);
      border-color: #ddd6fe;
    }
    .shiftDay.sg-night .shiftDayCode { color: #6d28d9; }
    .shiftDay.sg-off {
      background: linear-gradient(180deg, #f8fafc 0%, #fff 70%);
      border-color: #e2e8f0;
    }
    .shiftDay.sg-off .shiftDayCode { color: #64748b; }
    .shiftDay.sg-leave {
      background: linear-gradient(180deg, #ecfdf5 0%, #fff 70%);
      border-color: #a7f3d0;
    }
    .shiftDay.sg-leave .shiftDayCode { color: #047857; }
    .shiftDay.sg-sick {
      background: linear-gradient(180deg, #fff1f2 0%, #fff 70%);
      border-color: #fecdd3;
    }
    .shiftDay.sg-sick .shiftDayCode { color: #be123c; }
    .shiftDay.sg-training {
      background: linear-gradient(180deg, #eff6ff 0%, #fff 70%);
      border-color: #bfdbfe;
    }
    .shiftDay.sg-training .shiftDayCode { color: #1d4ed8; }
    .shiftDay.sg-standby {
      background: linear-gradient(180deg, #fff1f2 0%, #fff 70%);
      border-color: #fecaca;
    }
    .shiftDay.sg-standby .shiftDayCode { color: #be185d; }
    .shiftDay.sg-other {
      background: var(--surface);
      border-color: var(--border);
    }
    .shiftDay.sg-other .shiftDayCode { color: var(--text-muted); }

    .shiftDay.is-active {
      transform: scale(1.04);
      border-color: var(--brand);
      box-shadow:
        0 0 0 2px rgba(30, 64, 175, .18),
        0 4px 12px rgba(30, 64, 175, .14);
      z-index: 1;
    }
    .shiftDay.is-active .shiftDayNum { color: var(--brand); }
    .shiftDay.is-today:not(.is-active) {
      box-shadow: inset 0 0 0 1.5px rgba(30, 64, 175, .35);
    }

    /* ── Status / empty ── */
    .crewStatus, .crewEmpty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      margin: var(--space-md) var(--space-xs);
    }

    /* ── Crew track ── */
    .crewTrack {
      min-height: min(52vh, 420px);
      touch-action: pan-y;
    }
    .crewTrack.slide-left { animation: slideLeft .28s ease; }
    .crewTrack.slide-right { animation: slideRight .28s ease; }
    @keyframes slideLeft {
      from { opacity: .35; transform: translateX(28px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideRight {
      from { opacity: .35; transform: translateX(-28px); }
      to { opacity: 1; transform: none; }
    }

    /* ── Merged shift + count bar (light) ── */
    .crewSummary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      flex-wrap: nowrap;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 10px 14px;
      border: none;
      border-bottom: 1px solid var(--border);
      border-inline-start: 3px solid var(--shift-accent, var(--border));
      border-radius: 0;
      background: var(--surface);
      box-shadow: none;
      animation: shiftFadeIn .32s ease both;
    }
    .shiftChip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .shiftDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--shift-accent, var(--text-muted));
    }
    .shiftChipLabel {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2;
      color: var(--text);
    }
    .crewCount {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      white-space: nowrap;
    }

    .crewSummary.sg-morning {
      --shift-accent: #f59e0b;
      background: #fffdf8;
    }
    .crewSummary.sg-afternoon {
      --shift-accent: #f97316;
      background: #fffaf7;
    }
    .crewSummary.sg-night {
      --shift-accent: #6366f1;
      background: #f8f9ff;
    }
    .crewSummary.sg-off,
    .crewSummary.sg-leave,
    .crewSummary.sg-sick {
      --shift-accent: #94a3b8;
      background: #f8fafc;
    }
    .crewSummary.sg-training {
      --shift-accent: #0ea5e9;
      background: #f8fcff;
    }
    .crewSummary.sg-standby,
    .crewSummary.sg-other {
      --shift-accent: #64748b;
    }

    @keyframes shiftFadeIn {
      from { opacity: .55; }
      to { opacity: 1; }
    }

    /* ── Colleague list card ── */
    .crewCard {
      margin-block-start: var(--space-sm);
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .crewCard > .crewSummary:first-child {
      border-start-start-radius: calc(var(--radius-md) - 1px);
      border-start-end-radius: calc(var(--radius-md) - 1px);
    }

    /* One shared grid: name column + fixed ID column (IDs stack perfectly). */
    .empList {
      margin: 0;
      padding: 2px 0 4px;
      display: grid;
      grid-template-columns: max-content 7.25ch;
      column-gap: 6px;
      row-gap: 0;
      align-items: center;
      width: max-content;
      max-width: 100%;
      box-sizing: border-box;
    }
    body.ar .empList,
    html[lang="ar"] .empList {
      direction: rtl;
      margin-inline-start: 0;
      margin-inline-end: auto;
    }

    .deptHead {
      display: flex;
      align-items: center;
      gap: 6px;
      grid-column: 1 / -1;
      padding: 7px 14px 3px;
      min-height: 0;
      width: 100%;
      box-sizing: border-box;
      justify-content: flex-start;
    }
    body.ar .deptHead,
    html[lang="ar"] .deptHead {
      direction: rtl;
      justify-content: flex-start;
      text-align: right;
    }
    .empList > .deptHead:not(:first-child) {
      border-block-start: 1px solid var(--border);
      margin-block-start: 2px;
      padding-block-start: 9px;
    }
    .deptHead.tone-a,
    .empMain.tone-a,
    .empId.tone-a { background: var(--surface); }
    .deptHead.tone-b,
    .empMain.tone-b,
    .empId.tone-b { background: var(--surface-muted); }

    .deptHeadLabel {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--text-muted);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .roleDot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dept-default);
    }
    .deptHead[data-dept="Officers"] .roleDot { background: var(--dept-officers); }
    .deptHead[data-dept="Supervisors"] .roleDot { background: var(--dept-supervisors); }
    .deptHead[data-dept="Load Control"] .roleDot { background: var(--dept-load); }
    .deptHead[data-dept="Export Checker"] .roleDot { background: var(--dept-checker); }
    .deptHead[data-dept="Export Operators"] .roleDot { background: var(--dept-ops); }
    .deptHead[data-dept="Flight Dispatch"] .roleDot,
    .deptHead[data-dept="Flight Dispatch (Export)"] .roleDot,
    .deptHead[data-dept="Flight Dispatch (Import)"] .roleDot { background: var(--dept-flight); }
    .deptHead[data-dept="FLTA"] .roleDot { background: var(--dept-flta); }
    .deptHead[data-dept="Documentation"] .roleDot { background: #64748b; }
    .deptHead[data-dept="Import Checkers"] .roleDot { background: #6366f1; }
    .deptHead[data-dept="Import Operators"] .roleDot { background: #7c3aed; }
    .deptHead[data-dept="Release Control"] .roleDot { background: #0891b2; }

    .empMain {
      grid-column: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      padding: 6px 8px 6px 14px;
      border-inline-start: 3px solid transparent;
    }
    body.ar .empMain,
    html[lang="ar"] .empMain {
      justify-content: flex-start;
      padding: 6px 14px 6px 8px;
      border-inline-start: none;
      border-inline-end: 3px solid transparent;
    }
    .empName {
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.25;
      text-align: start;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    body.ar .empName,
    html[lang="ar"] .empName {
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
      direction: rtl;
      unicode-bidi: plaintext;
      text-align: right;
    }
    .empId {
      grid-column: 2;
      box-sizing: border-box;
      width: 7.25ch;
      min-width: 7.25ch;
      padding: 6px 14px 6px 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1.2;
      text-align: end;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0;
      white-space: nowrap;
      direction: ltr;
      unicode-bidi: isolate;
    }
    body.ar .empId,
    html[lang="ar"] .empId {
      padding: 6px 14px 6px 8px;
      text-align: start;
    }

    .empMain.is-self,
    .empId.is-self {
      background: var(--brand-soft) !important;
    }
    .empMain.is-self {
      border-inline-start-color: var(--brand);
    }
    body.ar .empMain.is-self,
    html[lang="ar"] .empMain.is-self {
      border-inline-start-color: transparent;
      border-inline-end-color: var(--brand);
    }

    .youPill {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 800;
      color: var(--brand);
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(30, 64, 175, .18);
      border-radius: var(--radius-pill);
      padding: 1px 6px;
      line-height: 1.3;
    }

    /* ── Rest / empty state ── */
    .restCard {
      margin-block-start: var(--space-md);
      min-height: min(44vh, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      box-shadow: var(--shadow-card);
      touch-action: pan-y;
    }
    .restIcon { font-size: 36px; margin-block-end: var(--space-sm); line-height: 1; }
    .restCard h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .restSubtitle {
      margin: 0 0 var(--space-sm);
      font-size: 15px;
      font-weight: 700;
      color: var(--brand);
      line-height: 1.3;
    }
    .restShift {
      margin: 0 0 var(--space-md) !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: var(--text-secondary) !important;
      line-height: 1.3 !important;
    }
    .restLead {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.45;
    }
    .restBody {
      margin: 0;
      max-width: 30em;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* ── Change person button ── */
    .changeEmp {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: var(--space-md) auto 0;
      padding: 13px var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--brand);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .changeEmp:active {
      transform: scale(.98);
      background: var(--surface-muted);
    }

    /* ── Picker sheet ── */
    .pickSheet {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, .5);
      z-index: 80;
      padding-block-end: env(safe-area-inset-bottom, 0px);
    }
    .pickSheet.open { display: flex; }
    .pickCard {
      width: min(100%, 680px);
      max-height: min(88dvh, 720px);
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: var(--space-md) var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pickCard h2 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
    }
    .pickCard .pickHint {
      margin: 0 0 var(--space-md);
      color: var(--text-muted);
      font-size: 13px;
    }
    #pickSearch {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 16px;
      margin-block-end: var(--space-sm);
    }
    #pickList {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      flex: 1;
    }
    .pickRow {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      margin-block-end: var(--space-xs);
      cursor: pointer;
      text-align: start;
    }
    .pickName {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .pickDept {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .pickEmpty { text-align: center; color: var(--text-muted); }
    .pickClose {
      margin-block-start: var(--space-sm);
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      background: var(--border);
      color: var(--text);
      font-weight: 800;
      padding: 12px;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      .empName { font-size: 13px; }
      .deptHeadLabel { font-size: 10px; }
      .backBtn {
        min-width: 44px;
        min-height: 44px;
        padding: 0;
      }
      .backBtnLabel { display: none; }
      .langToggle {
        min-width: 44px;
        min-height: 44px;
        padding: 6px 8px;
      }
      .langToggle-icon svg { width: 20px; height: 20px; }
      .langToggle-label { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="pageWrap">
    <header class="header">
      <div class="headerTop">
        <a class="backBtn" id="backBtn" href="../" aria-label="Back">
          <svg class="backBtnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          <span class="backBtnLabel" id="backBtnLabel">Back</span>
        </a>
        <button type="button" class="langToggle" id="langToggle" title="Switch language">
          <span class="langToggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18"/>
              <path d="M12 3a14 14 0 0 1 0 18"/>
              <path d="M12 3a14 14 0 0 0 0 18"/>
            </svg>
          </span>
          <span class="langToggle-label" id="langToggleLabel">ع</span>
        </button>
      </div>
      <div class="headerIdentity">
        <h1 class="empNameHeader" id="empNameHeader">—</h1>
        <p class="pageSubtitle" id="pageTitleMain">With me</p>
      </div>
      <div class="headerBody">
        <div class="dateNav">
          <div class="datePickerWrapper">
            <label class="dateTag" for="datePicker">
              <span class="dateTagMain">
                <span class="dateTagDay" id="dateTagDay">—</span>
                <span class="dateTagSide">
                  <span class="dateTagWeek" id="dateTagWeek"></span>
                  <span class="dateTagMonthWrap">
                    <span class="dateTagMonth" id="dateTagMonth"></span>
                  </span>
                </span>
              </span>
            </label>
            <input id="datePicker" type="date" aria-label="Select date">
          </div>
        </div>
      </div>
    </header>

    <div class="shiftStripWrap" id="shiftStripWrap" hidden>
      <div class="shiftStrip" id="shiftStrip" role="list" aria-label="Shift strip"></div>
    </div>

    <p class="crewStatus" id="crewStatus" hidden>Loading the roster…</p>
    <p class="crewEmpty" id="crewEmpty" hidden></p>
    <div class="crewTrack" id="crewTrack"></div>
    <button type="button" class="changeEmp" id="changeEmpBtn">Change person</button>
  </div>

  <div class="pickSheet" id="pickSheet" aria-hidden="true">
    <div class="pickCard" role="dialog" aria-labelledby="pickTitle">
      <h2 id="pickTitle">Choose your name</h2>
      <p class="pickHint" id="pickHint">So we can show who is on shift with you</p>
      <input id="pickSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search name or ID">
      <div id="pickList"></div>
      <button type="button" class="pickClose" id="pickCloseBtn">Close</button>
    </div>
  </div>

  <script src="../with-me.js?v=20260830wm54"></script>
</body>
</html>
