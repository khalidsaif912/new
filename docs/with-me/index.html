<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>With me</title>
  <script defer src="../ios-tap-fix.js?v=20260830wm"></script>
  <script src="../emp-id-gate.js?v=20260730a"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --brand: #1e40af;
      --brand-soft: #dbeafe;
      --brand-ring: rgba(30, 64, 175, .22);
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --space-xs: 6px;
      --space-sm: 10px;
      --space-md: 14px;
      --space-lg: 18px;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, .06);
      --shadow-self: 0 4px 14px rgba(30, 64, 175, .12);
      --dept-officers: #2563eb;
      --dept-supervisors: #0891b2;
      --dept-load: #059669;
      --dept-checker: #6366f1;
      --dept-ops: #7c3aed;
      --dept-flight: #0d9488;
      --dept-flta: #d97706;
      --dept-default: #64748b;
    }

    html, body { width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #eef1f7;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    * { box-sizing: border-box; }
    body.ar {
      font-family: 'Segoe UI', 'Segoe UI Arabic', Tahoma, Arial, sans-serif;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding:
        calc(var(--space-sm) + var(--safe-top))
        var(--space-md)
        calc(var(--space-lg) + var(--safe-bottom));
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(160deg, #1e3a8a 0%, var(--brand) 55%, #2563eb 100%);
      color: #fff;
      padding: var(--space-sm) var(--space-md) var(--space-md);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 18px rgba(30, 64, 175, .18);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset-block-start: -48px;
      inset-inline-end: -52px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
      pointer-events: none;
    }

    .headerTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-block-end: var(--space-md);
      position: relative;
      z-index: 2;
      direction: ltr;
    }

    .backBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 40px;
      min-height: 40px;
      padding: 0 12px 0 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .24);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .12);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .backBtn:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .34);
    }
    .backBtn:active { transform: scale(.97); }
    .backBtnIcon {
      display: block;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
    }
    .backBtnLabel {
      line-height: 1;
      white-space: nowrap;
    }

    .langToggle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 40px;
      min-height: 40px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .24);
      color: #fff;
      font-size: 0;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(15, 23, 42, .12);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .langToggle:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .34);
    }
    .langToggle:active { transform: scale(.97); }
    .langToggle-icon {
      line-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .langToggle-icon svg {
      display: block;
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
    }
    .langToggle-label {
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }

    .headerBody {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-inline: 4px;
    }

    .empNameHeader {
      margin: 0;
      font-size: clamp(22px, 5.5vw, 26px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.01em;
      color: #fff;
      word-break: break-word;
    }
    body.ar .empNameHeader { letter-spacing: 0; }

    .pageSubtitle {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, .78);
      line-height: 1.3;
    }

    .dateNav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      margin-block-start: var(--space-md);
      position: relative;
      z-index: 2;
    }

    .dayBtn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, .14);
      color: #fff;
      font-size: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dayBtn::before {
      content: '';
      display: block;
      width: 8px;
      height: 8px;
      border-inline-end: 2px solid #fff;
      border-block-end: 2px solid #fff;
      transform: rotate(135deg);
    }
    .dayBtn.next::before { transform: rotate(-45deg); }
    html[dir="rtl"] .dayBtn.prev::before { transform: rotate(-45deg); }
    html[dir="rtl"] .dayBtn.next::before { transform: rotate(135deg); }

    .datePickerWrapper {
      position: relative;
      flex: 1;
      min-width: 0;
      max-width: 280px;
    }
    .dateTag {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .22);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      text-align: center;
      line-height: 1.35;
    }
    .datePickerWrapper #datePicker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 16px;
      border: none;
    }

    /* ── Status / empty ── */
    .crewStatus, .crewEmpty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      margin: var(--space-md) var(--space-xs);
    }

    /* ── Crew track ── */
    .crewTrack {
      min-height: min(52vh, 420px);
      touch-action: manipulation;
    }
    .crewTrack.slide-left { animation: slideLeft .28s ease; }
    .crewTrack.slide-right { animation: slideRight .28s ease; }
    @keyframes slideLeft {
      from { opacity: .35; transform: translateX(28px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideRight {
      from { opacity: .35; transform: translateX(-28px); }
      to { opacity: 1; transform: none; }
    }

    /* ── Merged shift + count bar ── */
    .crewSummary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-block-start: var(--space-md);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .shiftChip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .shiftChipIcon { font-size: 16px; line-height: 1; }
    .shiftChipLabel { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .crewCount {
      font-size: 13px;
      font-weight: 700;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid rgba(30, 64, 175, .14);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      white-space: nowrap;
    }

    /* ── Colleague list card ── */
    .crewCard {
      margin-block-start: var(--space-sm);
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .empList {
      margin: 0;
      padding: 2px 0 4px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .deptGroup {
      padding-block-end: 2px;
    }
    .deptGroup + .deptGroup {
      border-block-start: 1px solid var(--border);
    }
    .deptGroup:nth-child(odd) { background: var(--surface); }
    .deptGroup:nth-child(even) { background: var(--surface-muted); }

    .deptHead {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px 3px;
      min-height: 0;
    }
    .deptHeadLabel {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--text-muted);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .roleDot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dept-default);
    }
    .deptGroup[data-dept="Officers"] .roleDot { background: var(--dept-officers); }
    .deptGroup[data-dept="Supervisors"] .roleDot { background: var(--dept-supervisors); }
    .deptGroup[data-dept="Load Control"] .roleDot { background: var(--dept-load); }
    .deptGroup[data-dept="Export Checker"] .roleDot { background: var(--dept-checker); }
    .deptGroup[data-dept="Export Operators"] .roleDot { background: var(--dept-ops); }
    .deptGroup[data-dept="Flight Dispatch"] .roleDot,
    .deptGroup[data-dept="Flight Dispatch (Export)"] .roleDot,
    .deptGroup[data-dept="Flight Dispatch (Import)"] .roleDot { background: var(--dept-flight); }
    .deptGroup[data-dept="FLTA"] .roleDot { background: var(--dept-flta); }
    .deptGroup[data-dept="Documentation"] .roleDot { background: #64748b; }
    .deptGroup[data-dept="Import Checkers"] .roleDot { background: #6366f1; }
    .deptGroup[data-dept="Import Operators"] .roleDot { background: #7c3aed; }
    .deptGroup[data-dept="Release Control"] .roleDot { background: #0891b2; }

    .empRow {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 6px 14px 6px 14px;
      border: none;
      background: transparent;
      border-inline-start: 3px solid transparent;
    }

    .empMain {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .empName {
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.25;
      direction: ltr;
      unicode-bidi: embed;
      text-align: start;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body.ar .empName {
      font-family: 'Segoe UI', 'Segoe UI Arabic', Tahoma, Arial, sans-serif;
    }
    .youPill {
      flex-shrink: 0;
      font-size: 9px;
      font-weight: 800;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid rgba(30, 64, 175, .18);
      border-radius: var(--radius-pill);
      padding: 1px 6px;
      line-height: 1.3;
    }

    .empRow.is-self {
      background: var(--brand-soft);
      border-inline-start: 3px solid var(--brand);
    }

    /* ── Rest / empty state ── */
    .restCard {
      margin-block-start: var(--space-md);
      min-height: min(44vh, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .restIcon { font-size: 36px; margin-block-end: var(--space-sm); line-height: 1; }
    .restCard h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .restSubtitle {
      margin: 0 0 var(--space-sm);
      font-size: 15px;
      font-weight: 700;
      color: var(--brand);
      line-height: 1.3;
    }
    .restShift {
      margin: 0 0 var(--space-md) !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: var(--text-secondary) !important;
      line-height: 1.3 !important;
    }
    .restLead {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.45;
    }
    .restBody {
      margin: 0;
      max-width: 30em;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* ── Change person button ── */
    .changeEmp {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: var(--space-md) auto 0;
      padding: 13px var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--brand);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .changeEmp:active {
      transform: scale(.98);
      background: var(--surface-muted);
    }

    /* ── Picker sheet ── */
    .pickSheet {
      position: fixed;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, .5);
      z-index: 80;
      padding-block-end: env(safe-area-inset-bottom, 0px);
    }
    .pickSheet.open { display: flex; }
    .pickCard {
      width: min(100%, 680px);
      max-height: min(88dvh, 720px);
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: var(--space-md) var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pickCard h2 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
    }
    .pickCard .pickHint {
      margin: 0 0 var(--space-md);
      color: var(--text-muted);
      font-size: 13px;
    }
    #pickSearch {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 16px;
      margin-block-end: var(--space-sm);
    }
    #pickList {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
      flex: 1;
    }
    .pickRow {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      margin-block-end: var(--space-xs);
      cursor: pointer;
      text-align: start;
    }
    .pickName {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .pickDept {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .pickEmpty { text-align: center; color: var(--text-muted); }
    .pickClose {
      margin-block-start: var(--space-sm);
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      background: var(--border);
      color: var(--text);
      font-weight: 800;
      padding: 12px;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      .empName { font-size: 13px; }
      .deptHeadLabel { font-size: 10px; }
      .backBtn {
        min-width: 44px;
        min-height: 44px;
        padding: 0;
      }
      .backBtnLabel { display: none; }
      .langToggle {
        min-width: 44px;
        min-height: 44px;
        padding: 6px 8px;
      }
      .langToggle-icon svg { width: 20px; height: 20px; }
      .langToggle-label { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="pageWrap">
    <header class="header">
      <div class="headerTop">
        <a class="backBtn" id="backBtn" href="../" aria-label="Back">
          <svg class="backBtnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          <span class="backBtnLabel" id="backBtnLabel">Back</span>
        </a>
        <button type="button" class="langToggle" id="langToggle" title="Switch language">
          <span class="langToggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18"/>
              <path d="M12 3a14 14 0 0 1 0 18"/>
              <path d="M12 3a14 14 0 0 0 0 18"/>
            </svg>
          </span>
          <span class="langToggle-label" id="langToggleLabel">ع</span>
        </button>
      </div>
      <div class="headerBody">
        <h1 class="empNameHeader" id="empNameHeader">—</h1>
        <p class="pageSubtitle" id="pageTitleMain">With me</p>
      </div>
      <div class="dateNav">
        <button type="button" class="dayBtn prev" id="prevDayBtn" aria-label="Previous day"></button>
        <div class="datePickerWrapper">
          <label class="dateTag" for="datePicker">
            <span class="dateTag-label" id="dateTagLabel">—</span>
          </label>
          <input id="datePicker" type="date" aria-label="Select date">
        </div>
        <button type="button" class="dayBtn next" id="nextDayBtn" aria-label="Next day"></button>
      </div>
    </header>

    <p class="crewStatus" id="crewStatus" hidden>Loading the roster…</p>
    <p class="crewEmpty" id="crewEmpty" hidden></p>
    <div class="crewTrack" id="crewTrack"></div>
    <button type="button" class="changeEmp" id="changeEmpBtn">Change person</button>
  </div>

  <div class="pickSheet" id="pickSheet" aria-hidden="true">
    <div class="pickCard" role="dialog" aria-labelledby="pickTitle">
      <h2 id="pickTitle">Choose your name</h2>
      <p class="pickHint" id="pickHint">So we can show who is on shift with you</p>
      <input id="pickSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search name or ID">
      <div id="pickList"></div>
      <button type="button" class="pickClose" id="pickCloseBtn">Close</button>
    </div>
  </div>

  <script src="../with-me.js?v=20260830wm19"></script>
</body>
</html>
