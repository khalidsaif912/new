name: Download SharePoint Absence File

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [absence-report-updated]
  schedule:
    # Backup only. GitHub often delays public-repo cron; Power Automate
    # must fire repository_dispatch as soon as absence-report.xlsb is overwritten.
    - cron: "0 */4 * * *"

concurrency:
  group: docs-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process absence report
        env:
          # Stable paths come from EXPORT_EXCEL_URL (ROSTER_UPLOADS / AbsenceReports).
          # ABSENCE_EXCEL_URL is a secondary :x: guest share only.
          # client_payload.absence_url overrides the secret for one dispatch.
          ABSENCE_EXCEL_URL: ${{ secrets.ABSENCE_EXCEL_URL }}
          ABSENCE_PAYLOAD_URL: ${{ github.event.client_payload.absence_url }}
          ABSENCE_EXCEL_FILE: ""
          EXPORT_EXCEL_URL: ${{ secrets.EXPORT_EXCEL_URL || secrets.EXCEL_URL }}
        run: |
          if [ -n "${ABSENCE_PAYLOAD_URL}" ]; then
            echo "Using absence_url from repository_dispatch client_payload"
          fi
          if [ -z "${ABSENCE_EXCEL_URL}" ] && [ -z "${EXPORT_EXCEL_URL}" ] && [ -z "${ABSENCE_PAYLOAD_URL}" ]; then
            echo "::error::Need EXPORT_EXCEL_URL (stable paths) and/or ABSENCE_EXCEL_URL"
            exit 1
          fi
          python process_absence.py

      - name: Commit and push absence updates
        run: |
          if [ -f "docs/absence-data.json" ]; then git add docs/absence-data.json; fi
          if [ -f "last_absence_hash.txt" ]; then git add last_absence_hash.txt; fi
          if [ -d "absence-archive" ]; then git add absence-archive; fi
          bash scripts/ci_commit_and_push.sh "Update absence data"

      - name: Upload downloaded absence file
        if: hashFiles('absence-archive/absence-report.xlsb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: absence-source-file
          path: absence-archive/absence-report.xlsb

      - name: Upload SharePoint debug payload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sharepoint-debug-response
          path: |
            debug_sharepoint_response.png
            debug_sharepoint_response.html
          if-no-files-found: ignore

      - name: Upload generated absence JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: absence-data-json
          path: docs/absence-data.json
