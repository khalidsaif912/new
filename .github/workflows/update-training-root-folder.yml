name: Update training docs folder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: docs-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sync shared HTML and regenerate training pages
        env:
          TRAINING_PAGE_SOURCE_URL: ${{ secrets.TRAINING_PAGE_SOURCE_URL }}
        run: |
          python sync_onedrive_training_root.py \
            --repo-root . \
            --data-file training_courses_data.json \
            --generator-script generate_training_archive_pages.py \
            --site-output-dir docs/training

      - name: Commit and push if changed
        run: |
          git add training_courses_data.json docs/training
          bash scripts/ci_commit_and_push.sh "Auto-update training pages in docs folder"
